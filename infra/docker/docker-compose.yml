name: akasha

# Akasha — local development topology (Slice 0).
#
# Mirrors the deployed services so the same architecture is portable to
# Docker Compose / on-prem. Only `web` publishes a host port; every other
# service is private to the `akasha` network. Persistent volumes back postgis
# and minio (never store state in ephemeral container filesystems).
#
# Usage:
#   cp .env.example .env   # then edit secrets
#   docker compose up --build
#   open http://localhost:${WEB_PORT:-8080}/health
#
# NOTE: This Compose file is the LOCAL DEV / on-prem portability artifact.
# Production deploys via the self-hosted Coolify/Azure path in infra/selfhosted
# (do NOT run this as a single production appliance).

services:
  web:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: infra/gateway/Dockerfile
      args:
        VITE_BASEMAP_PROVIDER: "${VITE_BASEMAP_PROVIDER:-osm}"
        VITE_ESRI_PUBLIC_ACCESS: "${VITE_ESRI_API_KEY:-}"
        VITE_ESRI_BASEMAP_STYLE: "${VITE_ESRI_BASEMAP_STYLE:-arcgis/imagery}"
        VITE_ESRI_BASEMAP_STYLE_FAMILY: "${VITE_ESRI_BASEMAP_STYLE_FAMILY:-arcgis}"
        VITE_ESRI_BASEMAP_PLACES: "${VITE_ESRI_BASEMAP_PLACES:-none}"
        VITE_ESRI_BASEMAP_SESSION_SECONDS: "${VITE_ESRI_BASEMAP_SESSION_SECONDS:-43200}"
    image: akasha-web:slice0
    environment:
      PORT: "80"
      API_UPSTREAM_URL: "http://api:8000"
      TITILER_UPSTREAM_URL: "http://titiler:8000"
      PUBLIC_APP_NAME: "${PUBLIC_APP_NAME:-Akasha}"
      PUBLIC_DEFAULT_AOI_NAME: "${PUBLIC_DEFAULT_AOI_NAME:-Bangalore}"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      titiler:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  api:
    platform: linux/amd64
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    image: akasha-api:slice0
    environment:
      APP_ENV: "development"
      PORT: "8000"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB}"
      STAC_API_URL: "http://stac-api:8080"
      TITILER_URL: "http://titiler:8000"
      S3_ENDPOINT_URL: "http://minio:9000"
      AKASHA_COG_BUCKET: "akasha-cogs"
      # Slice 2: server-side S3/GDAL config so the BFF (rasterio) can read MinIO
      # COG windows for masked statistics. Not exposed to the browser.
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_S3_ENDPOINT: "minio:9000"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_HTTPS: "NO"
      AWS_REGION: "us-east-1"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff"
      AKASHA_RGB_RESCALE: "0,3000"
      AKASHA_S1_VV_RESCALE: "-25,5"
      DEFAULT_SOURCE_ID: "${DEFAULT_SOURCE_ID:-resourcesat-2a-liss3-boa}"
      BASEMAP_PROVIDER: "${BASEMAP_PROVIDER:-esri}"
      ESRI_BASEMAP_STYLE: "${ESRI_BASEMAP_STYLE:-arcgis/imagery}"
      ESRI_BASEMAP_STYLE_FAMILY: "${ESRI_BASEMAP_STYLE_FAMILY:-arcgis}"
      ESRI_BASEMAP_USAGE_MODEL: "${ESRI_BASEMAP_USAGE_MODEL:-session}"
      ESRI_BASEMAP_PLACES: "${ESRI_BASEMAP_PLACES:-none}"
      ESRI_BASEMAP_SESSION_SECONDS: "${ESRI_BASEMAP_SESSION_SECONDS:-43200}"
      INGESTION_API_URL: "${INGESTION_API_URL:-}"
      INGESTION_API_KEY: "${INGESTION_API_KEY:-}"
      INGESTION_REQUEST_TIMEOUT_SECONDS: "${INGESTION_REQUEST_TIMEOUT_SECONDS:-30}"
      INGESTION_FIELD_INDEX_ENABLED: "${INGESTION_FIELD_INDEX_ENABLED:-false}"
      INGESTION_READINESS_ENABLED: "${INGESTION_READINESS_ENABLED:-false}"
      INGESTION_EOS04_CUTOVER_ENABLED: "${INGESTION_EOS04_CUTOVER_ENABLED:-false}"
      EOS04_PRODUCT_ENABLED: "${EOS04_PRODUCT_ENABLED:-false}"
      EOS04_FIELD_SUPPORT_ENABLED: "${EOS04_FIELD_SUPPORT_ENABLED:-false}"
      INGESTION_NISAR_CUTOVER_ENABLED: "${INGESTION_NISAR_CUTOVER_ENABLED:-false}"
      NISAR_PRODUCT_ENABLED: "${NISAR_PRODUCT_ENABLED:-false}"
      NISAR_FIELD_SUPPORT_ENABLED: "${NISAR_FIELD_SUPPORT_ENABLED:-false}"
      EOS04_TEMPORAL_CHANGE_ENABLED: "${EOS04_TEMPORAL_CHANGE_ENABLED:-false}"
      EOS04_TEMPORAL_SHADOW_ENABLED: "${EOS04_TEMPORAL_SHADOW_ENABLED:-false}"
      EOS04_TEMPORAL_RECOMMENDATIONS_ENABLED: "${EOS04_TEMPORAL_RECOMMENDATIONS_ENABLED:-false}"
      EOS04_TEMPORAL_LOOKBACK_DAYS: "${EOS04_TEMPORAL_LOOKBACK_DAYS:-180}"
      EOS04_TEMPORAL_MAX_OBSERVATIONS: "${EOS04_TEMPORAL_MAX_OBSERVATIONS:-8}"
      EOS04_TEMPORAL_MIN_BASELINE_OBSERVATIONS: "${EOS04_TEMPORAL_MIN_BASELINE_OBSERVATIONS:-5}"
      INGESTION_AOI_ID: "${INGESTION_AOI_ID:-bangalore_60km_geodesic_aoi}"
      INGESTION_SIGNED_URL_ALLOWED_PREFIX: "${INGESTION_SIGNED_URL_ALLOWED_PREFIX:-}"
      INGESTION_SIGNED_URL_FETCH_PREFIX: "${INGESTION_SIGNED_URL_FETCH_PREFIX:-}"
      INGESTION_TREND_MAX_DATES: "${INGESTION_TREND_MAX_DATES:-12}"
      DEFAULT_AOI_ID: ""
      AOI_CONFIG_PATH: "/app/data/seed/bangalore-60km-aoi.geojson"
      USABLE_PIXEL_THRESHOLD_PERCENT: "70"
      MAX_POLYGON_AREA_HA: "50"
      MAX_POLYGON_VERTICES: "5000"
      INDEX_REQUEST_TIMEOUT_SECONDS: "30"
      RATE_LIMIT_INDEX_PER_MINUTE: "30"
      SOURCE_FRESHNESS_STALE_DAYS: "45"
      SOURCE_COVERAGE_THRESHOLD_PERCENT: "95"
      MAX_REQUEST_BODY_BYTES: "1048576"
      BHOONIDHI_LEDGER_PATH: "/app/data/work/bhoonidhi/ledger.sqlite"
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173},http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080}"
      INGESTION_FIELD_INDEX_SOURCE_ID: "${INGESTION_FIELD_INDEX_SOURCE_ID:-sentinel-2-l2a}"
      INGESTION_FRESHNESS_MAX_AGE_HOURS: "${INGESTION_FRESHNESS_MAX_AGE_HOURS:-}"
      INGESTION_PIPELINE_TILE_LAYER_ENABLED: "${INGESTION_PIPELINE_TILE_LAYER_ENABLED:-false}"
      INGESTION_PIPELINE_PROXY_TTL_SECONDS: "${INGESTION_PIPELINE_PROXY_TTL_SECONDS:-3600}"
      # Enforced auth for the local stack. The browser must sign in via /login;
      # AUTH_COOKIE_SECURE is false ONLY because local dev is plain http
      # (hosted/customer deployments keep it true — see infra/selfhosted/env.example).
      AUTH_MODE: "enabled"
      AUTH_ALLOW_DISABLED: "false"
      AUTH_PASSWORD_PEPPER: "${AUTH_PASSWORD_PEPPER}"
      AUTH_ALLOW_SIGNUP: "${AUTH_ALLOW_SIGNUP:-true}"
      AUTH_COOKIE_SECURE: "false"
      INGESTION_JOB_INBOX_DIR: "/srv/akasha/ingestion-inbox"
      ADMIN_INGESTION_LIVE_TRIGGER_ENABLED: "${ADMIN_INGESTION_LIVE_TRIGGER_ENABLED:-false}"
    expose:
      - "8000"
    volumes:
      - ../../data/seed:/app/data/seed:ro
      - ../../scripts/data:/app/data/reference:ro
      - ../../data/work/bhoonidhi:/app/data/work/bhoonidhi:ro
      - ../../data/work/ingestion-inbox:/srv/akasha/ingestion-inbox
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  titiler:
    # Local Compose uses the pinned upstream image directly because the
    # Slice 0 Dockerfile is a no-op wrapper. Production builds the service
    # from services/titiler/Dockerfile.
    platform: linux/amd64
    image: ghcr.io/developmentseed/titiler:1.0.0
    environment:
      PORT: "8000"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_S3_ENDPOINT: "minio:9000"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_HTTPS: "NO"
      AWS_REGION: "us-east-1"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff"
    expose:
      - "8000"
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  stac-api:
    # Local Compose uses the pinned upstream image directly because the
    # Slice 0 Dockerfile is a no-op wrapper. Production builds the service
    # from services/stac-api/Dockerfile.
    platform: linux/amd64
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:5.0.2
    environment:
      POSTGRES_HOST_READER: "postgis"
      POSTGRES_HOST_WRITER: "postgis"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASS: "${POSTGRES_PASSWORD}"
      POSTGRES_DBNAME: "${POSTGRES_DB}"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
    expose:
      - "8080"
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/_mgmt/ping').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  postgis:
    platform: linux/amd64
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  minio:
    platform: linux/amd64
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      # Liveness via the documented endpoint. If your MinIO image lacks curl,
      # switch to: ["CMD", "mc", "ready", "local"].
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ingestion-worker:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
    image: akasha-ingestion:slice1
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB}"
      STAC_API_URL: "http://stac-api:8080"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_ACCESS_KEY: "${MINIO_ROOT_USER}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      S3_REGION: "us-east-1"
      AKASHA_COG_BUCKET: "akasha-cogs"
      AKASHA_COLLECTION_ID: "resourcesat-2a-liss3-boa"
      SEED_DATA_DIR: "/app/data/seed"
      AOI_CONFIG_PATH: "/app/data/seed/bangalore-60km-aoi.geojson"
      AOI_CONFIG_DIR: ""
      BHOONIDHI_API_BASE: "https://bhoonidhi-api.nrsc.gov.in"
      BHOONIDHI_USER_ID: "${BHOONIDHI_USER_ID:-}"
      BHOONIDHI_PASSWORD: "${BHOONIDHI_PASSWORD:-}"
      BHOONIDHI_SEARCH_RPS: "${BHOONIDHI_SEARCH_RPS:-3}"
      BHOONIDHI_DOWNLOAD_CONCURRENCY: "${BHOONIDHI_DOWNLOAD_CONCURRENCY:-3}"
      BHOONIDHI_RAW_ROOT: "/app/data/raw/bhoonidhi"
      BHOONIDHI_TEMP_ROOT: "/app/data/work/bhoonidhi"
      BHOONIDHI_LEDGER_PATH: "/app/data/work/bhoonidhi/ledger.sqlite"
    volumes:
      # Local Slice 2 raster prep needs ignored raw SAFE ZIPs and writes ignored COGs.
      - ../../data:/app/data
      - ../../scripts:/app/scripts:ro
    depends_on:
      postgis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      disable: true
    # One-shot: prints config and exits. Run seeding/verify on demand, e.g.:
    #   docker compose run --rm ingestion-worker python worker.py seed
    #   docker compose run --rm ingestion-worker python worker.py verify
    #   docker compose run --rm ingestion-worker python worker.py verify-composite --source resourcesat-2a-liss3-boa --aoi bangalore-60km
    restart: "no"

  ingestion-sar:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: services/ingestion-sar/Dockerfile
    image: akasha-ingestion-sar:s1
    environment:
      PATH: "/opt/snap/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      SNAP_USER_DIR: "/snap-cache"
      SNAP_CACHE_SIZE: "${SNAP_CACHE_SIZE:-8G}"
      SNAP_PARALLELISM: "${SNAP_PARALLELISM:-4}"
      JAVA_TOOL_OPTIONS: "-Xmx${SNAP_JAVA_MAX_HEAP:-12g}"
      AKASHA_S1_DEM_SOURCE: "${AKASHA_S1_DEM_SOURCE:-Copernicus 30m Global DEM}"
      AKASHA_S1_FALLBACK_DEM_SOURCE: "${AKASHA_S1_FALLBACK_DEM_SOURCE:-SRTM 1Sec HGT}"
      AKASHA_S1_TARGET_CRS: "${AKASHA_S1_TARGET_CRS:-EPSG:4326}"
      AKASHA_S1_PIXEL_SPACING_METERS: "${AKASHA_S1_PIXEL_SPACING_METERS:-10}"
      AKASHA_S1_VV_RESCALE: "${AKASHA_S1_VV_RESCALE:--25,5}"
      AKASHA_S1_VH_RESCALE: "${AKASHA_S1_VH_RESCALE:--30,-5}"
    volumes:
      - ../../data:/app/data
      - ../../scripts:/app/scripts:ro
      - snap_cache:/snap-cache
    healthcheck:
      disable: true
    # One-shot SAR preprocessing runtime. Example:
    #   docker compose run --rm ingestion-sar python scripts/prepare_sentinel1_grd_cogs.py --selection-manifest data/raw/sentinel-1-grd/coverage_manifest.json --overwrite
    restart: "no"

volumes:
  postgis_data:
  minio_data:
  snap_cache:
