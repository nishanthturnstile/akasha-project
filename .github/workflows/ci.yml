name: CI

on:
  pull_request:
    branches:
      - main
      - dev-akasha-core
  push:
    branches:
      - main
      - dev-akasha-core

permissions:
  contents: read

env:
  # Opt JavaScript actions into Node.js 24 ahead of the June 2026 runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-api:
    name: Python API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-dev.txt
            apps/api/requirements.txt

      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Run API tests
        working-directory: apps/api
        run: python -m pytest -q

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: apps/frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: yarn install --frozen-lockfile

      - name: Lint frontend
        working-directory: apps/frontend
        run: yarn lint

      - name: Test frontend
        working-directory: apps/frontend
        run: yarn test

      - name: Build frontend
        working-directory: apps/frontend
        run: yarn build

  validators:
    name: Slice validators
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install validator dependencies
        run: |
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install pyyaml

      - name: Run Slice 0 validator
        run: python scripts/validate_slice0.py

      - name: Run Slice 1 validator
        run: python scripts/validate_slice1.py

      - name: Run Slice 2 validator
        run: python scripts/validate_slice2.py

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
