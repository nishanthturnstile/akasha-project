<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akasha by CIDSA — Crop Intelligence</title>
    <meta
      name="description"
      content="Akasha by CIDSA — satellite imagery, field analytics, and crop intelligence for Indian agriculture."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved preference before first paint. CIDSA defaults to light.
      (function () {
        try {
          var stored = localStorage.getItem('akasha.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
