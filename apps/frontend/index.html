<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akasha — Orbital Field Instrument</title>
    <meta
      name="description"
      content="Akasha — Sentinel-2 satellite imagery for Indian agriculture. Clarity from above."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the persisted (or OS-preferred, default dark) theme before first paint
      // so there is no light→dark flash on load. Mirrors ThemeToggle's resolution.
      (function () {
        try {
          var stored = localStorage.getItem('akasha.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
