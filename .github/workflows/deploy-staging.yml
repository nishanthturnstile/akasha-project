name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: akasha-techcatalyst
  COMPOSE_TEMPLATE: infra/selfhosted/coolify-compose.yml
  RENDERED_COMPOSE: .akasha-coolify-compose.yml
  # Opt JavaScript actions into Node.js 24 ahead of the June 2026 runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-web-basemap-config:
    name: Validate hosted basemap build settings
    if: github.repository == 'Akasha-TechCatalyst/akasha-project'
    runs-on: ubuntu-latest
    env:
      VITE_BASEMAP_PROVIDER: esri
      VITE_ESRI_API_KEY: ${{ vars.VITE_ESRI_API_KEY || '' }}
      VITE_ESRI_BASEMAP_STYLE: ${{ vars.VITE_ESRI_BASEMAP_STYLE || 'arcgis/imagery' }}
      VITE_ESRI_BASEMAP_STYLE_FAMILY: ${{ vars.VITE_ESRI_BASEMAP_STYLE_FAMILY || 'arcgis' }}
      ESRI_BASEMAP_USAGE_MODEL: ${{ vars.ESRI_BASEMAP_USAGE_MODEL || 'session' }}
    steps:
      - name: Mask Esri public key
        shell: bash
        run: |
          if [[ -n "$VITE_ESRI_API_KEY" ]]; then
            echo "::add-mask::$VITE_ESRI_API_KEY"
          fi

      - name: Validate hosted basemap build settings
        shell: bash
        run: |
          set -euo pipefail
          provider="${VITE_BASEMAP_PROVIDER,,}"
          if [[ "$provider" != "esri" ]]; then
            exit 0
          fi

          compact_key="${VITE_ESRI_API_KEY//[[:space:]]/}"
          case "$compact_key" in
            ""|CHANGE_ME*|\<*\>)
              echo "VITE_ESRI_API_KEY must be configured for hosted Esri builds."
              exit 1
              ;;
          esac
          [[ -n "${VITE_ESRI_BASEMAP_STYLE//[[:space:]]/}" ]] || {
            echo "VITE_ESRI_BASEMAP_STYLE must be configured for hosted Esri builds."
            exit 1
          }
          [[ "${VITE_ESRI_BASEMAP_STYLE_FAMILY,,}" == "arcgis" ]] || {
            echo "VITE_ESRI_BASEMAP_STYLE_FAMILY must be arcgis."
            exit 1
          }
          usage_model="${ESRI_BASEMAP_USAGE_MODEL,,}"
          [[ "$usage_model" == "session" || "$usage_model" == "tile" ]] || {
            echo "ESRI_BASEMAP_USAGE_MODEL must be session or tile."
            exit 1
          }

  build-images:
    name: Build and push ${{ matrix.image }}
    if: github.repository == 'Akasha-TechCatalyst/akasha-project'
    needs: validate-web-basemap-config
    runs-on: [self-hosted, linux, x64, akasha-control]
    env:
      VITE_ESRI_API_KEY: ${{ vars.VITE_ESRI_API_KEY || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: akasha-web
            context: .
            dockerfile: infra/gateway/Dockerfile
            build_args: |
              VITE_BASEMAP_PROVIDER=esri
              VITE_ESRI_BASEMAP_STYLE=${{ vars.VITE_ESRI_BASEMAP_STYLE || 'arcgis/imagery' }}
              VITE_ESRI_BASEMAP_STYLE_FAMILY=${{ vars.VITE_ESRI_BASEMAP_STYLE_FAMILY || 'arcgis' }}
              VITE_ESRI_BASEMAP_PLACES=${{ vars.VITE_ESRI_BASEMAP_PLACES || 'none' }}
              VITE_ESRI_BASEMAP_SESSION_SECONDS=${{ vars.VITE_ESRI_BASEMAP_SESSION_SECONDS || '43200' }}
          - image: akasha-api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            build_args: ""
    steps:
      - name: Mask Esri public key
        shell: bash
        run: |
          if [[ -n "$VITE_ESRI_API_KEY" ]]; then
            echo "::add-mask::$VITE_ESRI_API_KEY"
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            ${{ matrix.build_args }}
            VITE_ESRI_PUBLIC_ACCESS=${{ matrix.image == 'akasha-web' && env.VITE_ESRI_API_KEY || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}

  deploy-staging:
    name: Patch Coolify staging stack and deploy
    if: github.repository == 'Akasha-TechCatalyst/akasha-project'
    needs: build-images
    runs-on: [self-hosted, linux, x64, akasha-control]
    env:
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_STAGING_SERVICE_UUID }}
      IMAGE_TAG: ${{ github.sha }}
      ADMIN_INGESTION_LIVE_TRIGGER_ENABLED: ${{ vars.ADMIN_INGESTION_LIVE_TRIGGER_ENABLED || 'true' }}
      INGESTION_RESOURCESAT_CUTOVER_ENABLED: ${{ vars.INGESTION_RESOURCESAT_CUTOVER_ENABLED || 'true' }}
      INGESTION_RESOURCESAT_CUTOVER_SOURCE_IDS: resourcesat-2a-liss3-boa,resourcesat-2a-liss4-mx70-l2,resourcesat-2a-awifs-boa
      # Activated after the 2026-07-18 capped real-product acceptance run.
      INGESTION_EOS04_CUTOVER_ENABLED: ${{ vars.INGESTION_EOS04_CUTOVER_ENABLED || 'true' }}
      EOS04_PRODUCT_ENABLED: ${{ vars.EOS04_PRODUCT_ENABLED || 'true' }}
      EOS04_FIELD_SUPPORT_ENABLED: ${{ vars.EOS04_FIELD_SUPPORT_ENABLED || 'true' }}
      EOS04_TEMPORAL_CHANGE_ENABLED: ${{ vars.EOS04_TEMPORAL_CHANGE_ENABLED || 'false' }}
      EOS04_TEMPORAL_SHADOW_ENABLED: ${{ vars.EOS04_TEMPORAL_SHADOW_ENABLED || 'true' }}
      EOS04_TEMPORAL_RECOMMENDATIONS_ENABLED: ${{ vars.EOS04_TEMPORAL_RECOMMENDATIONS_ENABLED || 'false' }}
      ESRI_BASEMAP_USAGE_MODEL: ${{ vars.ESRI_BASEMAP_USAGE_MODEL || 'session' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR for image verification
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployment configuration
        run: |
          test -n "$COOLIFY_API_URL" || { echo "COOLIFY_API_URL secret is required, including /api/v1."; exit 1; }
          test -n "$COOLIFY_TOKEN" || { echo "COOLIFY_TOKEN secret is required."; exit 1; }
          test -n "$COOLIFY_SERVICE_UUID" || { echo "COOLIFY_STAGING_SERVICE_UUID repository variable is required."; exit 1; }
          case "$IMAGE_TAG" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "IMAGE_TAG must be a Git SHA."; exit 1 ;;
          esac

      - name: Verify immutable image tags exist
        run: |
          set -euo pipefail
          for image in akasha-web akasha-api; do
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/${image}:${IMAGE_TAG}"
            echo "Checking ${ref}"
            docker manifest inspect "${ref}" >/dev/null
          done

      - name: Render Compose with immutable image tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          tag = os.environ["IMAGE_TAG"]
          admin_live = os.environ.get("ADMIN_INGESTION_LIVE_TRIGGER_ENABLED", "true").lower()
          if admin_live not in {"true", "false"}:
              raise SystemExit("ADMIN_INGESTION_LIVE_TRIGGER_ENABLED must be true or false")
          resourcesat_cutover = os.environ.get(
              "INGESTION_RESOURCESAT_CUTOVER_ENABLED", "true"
          ).lower()
          if resourcesat_cutover != "true":
              raise SystemExit("Staging requires INGESTION_RESOURCESAT_CUTOVER_ENABLED=true")
          resourcesat_sources = {
              value.strip()
              for value in os.environ.get(
                  "INGESTION_RESOURCESAT_CUTOVER_SOURCE_IDS", ""
              ).split(",")
              if value.strip()
          }
          required_sources = {
              "resourcesat-2a-liss3-boa",
              "resourcesat-2a-liss4-mx70-l2",
              "resourcesat-2a-awifs-boa",
          }
          if resourcesat_sources != required_sources:
              raise SystemExit(
                  "Staging ResourceSat cutover must contain exactly all three source IDs"
              )
          eos04_cutover = os.environ.get(
              "INGESTION_EOS04_CUTOVER_ENABLED", "false"
          ).lower()
          eos04_product = os.environ.get("EOS04_PRODUCT_ENABLED", "false").lower()
          eos04_field_support = os.environ.get("EOS04_FIELD_SUPPORT_ENABLED", "false").lower()
          eos04_temporal_change = os.environ.get("EOS04_TEMPORAL_CHANGE_ENABLED", "false").lower()
          eos04_temporal_shadow = os.environ.get("EOS04_TEMPORAL_SHADOW_ENABLED", "false").lower()
          eos04_temporal_recommendations = os.environ.get(
              "EOS04_TEMPORAL_RECOMMENDATIONS_ENABLED", "false"
          ).lower()
          for name, value in (
              ("INGESTION_EOS04_CUTOVER_ENABLED", eos04_cutover),
              ("EOS04_PRODUCT_ENABLED", eos04_product),
              ("EOS04_FIELD_SUPPORT_ENABLED", eos04_field_support),
              ("EOS04_TEMPORAL_CHANGE_ENABLED", eos04_temporal_change),
              ("EOS04_TEMPORAL_SHADOW_ENABLED", eos04_temporal_shadow),
              ("EOS04_TEMPORAL_RECOMMENDATIONS_ENABLED", eos04_temporal_recommendations),
          ):
              if value not in {"true", "false"}:
                  raise SystemExit(f"{name} must be true or false")
          if eos04_product == "true" and eos04_cutover != "true":
              raise SystemExit(
                  "EOS04_PRODUCT_ENABLED=true requires "
                  "INGESTION_EOS04_CUTOVER_ENABLED=true"
              )
          if eos04_field_support == "true" and eos04_cutover != "true":
              raise SystemExit(
                  "EOS04_FIELD_SUPPORT_ENABLED=true requires "
                  "INGESTION_EOS04_CUTOVER_ENABLED=true"
              )
          if eos04_temporal_change == "true" and eos04_field_support != "true":
              raise SystemExit(
                  "EOS04_TEMPORAL_CHANGE_ENABLED=true requires EOS04_FIELD_SUPPORT_ENABLED=true"
              )
          if eos04_temporal_recommendations == "true" and eos04_temporal_change != "true":
              raise SystemExit(
                  "EOS04_TEMPORAL_RECOMMENDATIONS_ENABLED=true requires "
                  "EOS04_TEMPORAL_CHANGE_ENABLED=true"
              )
          esri_usage_model = os.environ.get("ESRI_BASEMAP_USAGE_MODEL", "session").lower()
          if esri_usage_model not in {"session", "tile"}:
              raise SystemExit("ESRI_BASEMAP_USAGE_MODEL must be session or tile")
          app_data_root = os.environ.get("APP_DATA_ROOT", "/data/akasha").rstrip("/")
          if not app_data_root.startswith("/"):
              raise SystemExit("APP_DATA_ROOT must be an absolute host path")
          text = Path(os.environ.get("COMPOSE_TEMPLATE", "infra/selfhosted/coolify-compose.yml")).read_text()
          text = text.replace("${IMAGE_TAG:?IMAGE_TAG must be set to a Git SHA}", tag)
          text = text.replace("${ADMIN_INGESTION_LIVE_TRIGGER_ENABLED:-false}", admin_live)
          text = text.replace(
              "${INGESTION_RESOURCESAT_CUTOVER_ENABLED:-true}",
              resourcesat_cutover,
          )
          text = text.replace(
              "${INGESTION_RESOURCESAT_CUTOVER_SOURCE_IDS:-resourcesat-2a-liss3-boa,resourcesat-2a-liss4-mx70-l2,resourcesat-2a-awifs-boa}",
              ",".join(sorted(resourcesat_sources)),
          )
          text = text.replace(
              "${INGESTION_EOS04_CUTOVER_ENABLED:-false}", eos04_cutover
          )
          text = text.replace("${EOS04_PRODUCT_ENABLED:-false}", eos04_product)
          text = text.replace("${EOS04_FIELD_SUPPORT_ENABLED:-false}", eos04_field_support)
          text = text.replace("${EOS04_TEMPORAL_CHANGE_ENABLED:-false}", eos04_temporal_change)
          text = text.replace("${EOS04_TEMPORAL_SHADOW_ENABLED:-false}", eos04_temporal_shadow)
          text = text.replace(
              "${EOS04_TEMPORAL_RECOMMENDATIONS_ENABLED:-false}",
              eos04_temporal_recommendations,
          )
          text = text.replace("${ESRI_BASEMAP_USAGE_MODEL:-session}", esri_usage_model)
          text = text.replace("${APP_DATA_ROOT:-/data/akasha}", app_data_root)
          Path(os.environ["RENDERED_COMPOSE"]).write_text(text)
          PY

      - name: Sync API reference data
        run: |
          set -euo pipefail
          target="${APP_DATA_ROOT:-/data/akasha}/data/reference"
          sudo install -d -m 0755 "$target"
          sudo install -m 0644 scripts/data/*.json "$target/"
          test -s "$target/irrigation-types.json"
          test -s "$target/predefined-seasons.json"

      - name: Patch Coolify service stack
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          api_url = os.environ["COOLIFY_API_URL"].rstrip("/")
          service_uuid = os.environ["COOLIFY_SERVICE_UUID"]
          token = os.environ["COOLIFY_TOKEN"]
          compose = open(os.environ["RENDERED_COMPOSE"], "rb").read()
          payload = json.dumps(
              {
                  "docker_compose_raw": base64.b64encode(compose).decode(),
                  "instant_deploy": True,
              }
          ).encode()
          req = urllib.request.Request(
              f"{api_url}/services/{service_uuid}",
              data=payload,
              method="PATCH",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=60) as response:  # noqa: S310
              print(response.status, response.read().decode(errors="replace"))

          deploy_query = urllib.parse.urlencode(
              {"uuid": service_uuid, "force": "true"}
          )
          deploy_req = urllib.request.Request(
              f"{api_url}/deploy?{deploy_query}",
              data=b"",
              method="POST",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(deploy_req, timeout=60) as response:  # noqa: S310
              print(response.status, response.read().decode(errors="replace"))
          PY

      - name: Verify deployed image revisions
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          expected = os.environ["IMAGE_TAG"]
          service_uuid = os.environ["COOLIFY_SERVICE_UUID"]
          deadline = time.monotonic() + 600
          last_status = {}

          while time.monotonic() < deadline:
              status = {}
              for role in ("api", "web"):
                  name = f"{role}-{service_uuid}"
                  result = subprocess.run(
                      ["docker", "inspect", name],
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode != 0:
                      status[role] = {"revision": None, "health": "missing"}
                      continue
                  inspection = json.loads(result.stdout)[0]
                  status[role] = {
                      "revision": inspection.get("Config", {})
                      .get("Labels", {})
                      .get("org.opencontainers.image.revision"),
                      "health": inspection.get("State", {})
                      .get("Health", {})
                      .get("Status"),
                  }
              last_status = status
              if all(
                  values["revision"] == expected and values["health"] == "healthy"
                  for values in status.values()
              ):
                  print(json.dumps(status, sort_keys=True))
                  break
              time.sleep(5)
          else:
              raise SystemExit(
                  "Coolify rollout did not reach the expected healthy image revisions: "
                  + json.dumps(last_status, sort_keys=True)
              )
          PY
