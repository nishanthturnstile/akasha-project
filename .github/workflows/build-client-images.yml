name: Build client images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-client-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Docker image names must be lowercase even if the GitHub org display name uses capitals.
  IMAGE_NAMESPACE: akasha-techcatalyst

jobs:
  build:
    name: Build and push ${{ matrix.image }}
    # This workflow is synced from the source repo, but images must only be built
    # and published from the client-owned repository/namespace.
    if: github.repository == 'Akasha-TechCatalyst/akasha-project'
    runs-on: [self-hosted, linux, x64, akasha-control]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: akasha-web
            context: .
            dockerfile: infra/gateway/Dockerfile
            build_args: |
              VITE_ESRI_API_KEY=${{ vars.VITE_ESRI_API_KEY || '' }}
              VITE_ESRI_BASEMAP_STYLE=${{ vars.VITE_ESRI_BASEMAP_STYLE || 'arcgis/imagery' }}
              VITE_ESRI_BASEMAP_STYLE_FAMILY=${{ vars.VITE_ESRI_BASEMAP_STYLE_FAMILY || 'arcgis' }}
              VITE_ESRI_BASEMAP_PLACES=${{ vars.VITE_ESRI_BASEMAP_PLACES || 'none' }}
              VITE_ESRI_BASEMAP_SESSION_SECONDS=${{ vars.VITE_ESRI_BASEMAP_SESSION_SECONDS || '43200' }}
          - image: akasha-api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            build_args: ""
          - image: akasha-ingestion-worker
            context: .
            dockerfile: services/ingestion/Dockerfile
            build_args: ""
          - image: akasha-ingestion-sar
            context: .
            dockerfile: services/ingestion-sar/Dockerfile
            build_args: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
