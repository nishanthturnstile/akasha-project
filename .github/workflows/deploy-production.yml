name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact Git SHA image tag previously validated in staging
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: akasha-techcatalyst
  COMPOSE_TEMPLATE: infra/selfhosted/coolify-compose.yml
  RENDERED_COMPOSE: .akasha-coolify-compose.yml
  # Opt JavaScript actions into Node.js 24 ahead of the June 2026 runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-production:
    name: Patch Coolify production stack and deploy
    if: github.repository == 'Akasha-TechCatalyst/akasha-project'
    runs-on: [self-hosted, linux, x64, akasha-control]
    environment: production
    env:
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_PRODUCTION_SERVICE_UUID }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      ESRI_WEB_IMAGE_APPROVED_SHA: ${{ vars.ESRI_WEB_IMAGE_APPROVED_SHA }}
      ESRI_WEB_IMAGE_CREDENTIAL_ID: ${{ vars.ESRI_WEB_IMAGE_CREDENTIAL_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR for image verification
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate production deployment configuration
        run: |
          test -n "$COOLIFY_API_URL" || { echo "COOLIFY_API_URL secret is required, including /api/v1."; exit 1; }
          test -n "$COOLIFY_TOKEN" || { echo "COOLIFY_TOKEN secret is required."; exit 1; }
          test -n "$COOLIFY_SERVICE_UUID" || { echo "COOLIFY_PRODUCTION_SERVICE_UUID repository variable is required."; exit 1; }
          credential_id="${ESRI_WEB_IMAGE_CREDENTIAL_ID//[[:space:]]/}"
          [[ -n "$credential_id" ]] || { echo "ESRI_WEB_IMAGE_CREDENTIAL_ID is required in the protected production environment."; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "image_tag must be a full 40-character lowercase Git SHA."; exit 1; }
          [[ "$ESRI_WEB_IMAGE_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ESRI_WEB_IMAGE_APPROVED_SHA must be a full 40-character lowercase Git SHA."; exit 1; }
          if [[ "$ESRI_WEB_IMAGE_APPROVED_SHA" != "$IMAGE_TAG" ]]; then
            echo "The requested web image SHA is not approved for the production Esri referrer."
            exit 1
          fi

      - name: Verify immutable image tags exist
        run: |
          set -euo pipefail
          for image in akasha-web akasha-api; do
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/${image}:${IMAGE_TAG}"
            echo "Checking ${ref}"
            docker manifest inspect "${ref}" >/dev/null
          done

      - name: Render Compose with approved image tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          tag = os.environ["IMAGE_TAG"]
          app_data_root = os.environ.get("APP_DATA_ROOT", "/data/akasha").rstrip("/")
          if not app_data_root.startswith("/"):
              raise SystemExit("APP_DATA_ROOT must be an absolute host path")
          text = Path(os.environ.get("COMPOSE_TEMPLATE", "infra/selfhosted/coolify-compose.yml")).read_text()
          text = text.replace("${IMAGE_TAG:?IMAGE_TAG must be set to a Git SHA}", tag)
          text = text.replace("${APP_DATA_ROOT:-/data/akasha}", app_data_root)
          Path(os.environ["RENDERED_COMPOSE"]).write_text(text)
          PY

      - name: Patch Coolify service stack
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          api_url = os.environ["COOLIFY_API_URL"].rstrip("/")
          service_uuid = os.environ["COOLIFY_SERVICE_UUID"]
          token = os.environ["COOLIFY_TOKEN"]
          compose = open(os.environ["RENDERED_COMPOSE"], "rb").read()
          payload = json.dumps(
              {
                  "docker_compose_raw": base64.b64encode(compose).decode(),
                  "instant_deploy": True,
              }
          ).encode()
          req = urllib.request.Request(
              f"{api_url}/services/{service_uuid}",
              data=payload,
              method="PATCH",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=60) as response:  # noqa: S310
              print(response.status, response.read().decode(errors="replace"))
          PY
