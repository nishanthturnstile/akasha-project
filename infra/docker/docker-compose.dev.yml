name: akasha

# Local developer overlay.
#
# Keep infra/docker/docker-compose.yml production-like. This file is used only by
# local helper commands to add FastAPI hot reload and source bind mounts. It is
# intentionally not referenced by self-hosted/Coolify production deployment.

services:
  postgis:
    # Local GUI access only. The base compose keeps PostGIS private; this dev
    # overlay binds the database to localhost so DBeaver/SQLTools can inspect it
    # without exposing port 5432 on the LAN.
    ports:
      - "127.0.0.1:15432:5432"

  api:
    environment:
      # Docker Desktop on Windows/WSL can miss inotify events from bind mounts.
      # Polling is slower but much more predictable for team-local development.
      WATCHFILES_FORCE_POLLING: "${WATCHFILES_FORCE_POLLING:-true}"
      INGESTION_JOB_INBOX_DIR: "/srv/akasha/ingestion-inbox"
      ADMIN_INGESTION_LIVE_TRIGGER_ENABLED: "${ADMIN_INGESTION_LIVE_TRIGGER_ENABLED:-false}"
    volumes:
      # Live API source for backend hot reload.
      - ../../apps/api/app:/app/app
      # Writable so `make db-revision` can generate migration files on the host.
      - ../../apps/api/alembic:/app/alembic
      - ../../apps/api/alembic.ini:/app/alembic.ini:ro
    command:
      - sh
      - -c
      - >-
        python -m app.cli db upgrade &&
        uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000}
        --reload --reload-dir /app/app
